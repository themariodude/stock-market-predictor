name: Deployment

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (production requires the main branch)
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true
      release_sha:
        description: Full commit SHA of the staging-validated release (production only)
        type: string
        required: false
      staging_run_id:
        description: Successful staging workflow run ID (production only)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  validate-target:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict production to main and staging to develop
        env:
          TARGET_ENV: ${{ inputs.environment || 'staging' }}
          SOURCE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$TARGET_ENV" == production && "$SOURCE_REF" == refs/heads/main && "$EVENT_NAME" == workflow_dispatch ]] || \
             [[ "$TARGET_ENV" == staging && "$SOURCE_REF" == refs/heads/develop ]]; then
            exit 0
          fi
          echo 'Deployment environment does not match the source branch.'
          exit 1

  secrets-scan:
    needs: validate-target
    if: inputs.environment != 'production'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan complete Git history with redaction
        run: gitleaks detect --redact --log-opts=--all --no-banner

  backend-checks:
    needs: validate-target
    if: inputs.environment != 'production'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check app tests

      - name: Check formatting
        run: ruff format --check app tests

      - name: Run tests
        run: pytest

      - name: Check deployment scripts
        run: |
          ruff check ../scripts/deploy.py ../scripts/release.py ../scripts/tests
          ruff format --check ../scripts/deploy.py ../scripts/release.py ../scripts/tests
          python -m pytest ../scripts/tests

  frontend-checks:
    needs: validate-target
    if: inputs.environment != 'production'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

  build-and-push:
    needs:
      - secrets-scan
      - backend-checks
      - frontend-checks

    if: inputs.environment != 'production'

    runs-on: ubuntu-latest

    outputs:
      backend_image: ${{ steps.images.outputs.backend_image }}
      frontend_image: ${{ steps.images.outputs.frontend_image }}

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -f infra/docker/Dockerfile.backend \
            -t ghcr.io/${{ github.repository_owner }}/stock-market-predictor-backend:${{ github.sha }} \
            .

      - name: Build frontend image
        run: |
          docker build \
            -f infra/docker/Dockerfile.frontend \
            -t ghcr.io/${{ github.repository_owner }}/stock-market-predictor-frontend:${{ github.sha }} \
            .

      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/stock-market-predictor-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/stock-market-predictor-frontend:${{ github.sha }}

      - name: Capture published image digests
        id: images
        run: python3 scripts/release.py capture

  deploy:
    needs: build-and-push
    if: inputs.environment != 'production'
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: github-deploy-${{ github.run_id }}

      - name: Deploy through SSM without streaming remote logs
        env:
          DEPLOY_INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: python3 scripts/deploy.py --environment staging

  smoke-test:
    needs: deploy
    if: inputs.environment != 'production'
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run post-deployment smoke tests
        env:
          SMOKE_BACKEND_URL: ${{ secrets.SMOKE_BACKEND_URL }}
          SMOKE_FRONTEND_URL: ${{ secrets.SMOKE_FRONTEND_URL }}
        run: |
          : "${SMOKE_BACKEND_URL:?SMOKE_BACKEND_URL secret is not set}"
          : "${SMOKE_FRONTEND_URL:?SMOKE_FRONTEND_URL secret is not set}"
          python3 scripts/smoke_test.py

  record-release:
    needs:
      - build-and-push
      - smoke-test
    if: inputs.environment != 'production'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout release recorder
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Record tested image digests
        env:
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend_image }}
        run: python3 scripts/release.py record

      - name: Preserve staging release evidence
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ github.run_id }}
          path: release-candidate.json
          if-no-files-found: error
          retention-days: 90

  verify-release:
    needs: validate-target
    if: inputs.environment == 'production'
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      packages: read

    outputs:
      backend_image: ${{ steps.verify.outputs.backend_image }}
      frontend_image: ${{ steps.verify.outputs.frontend_image }}

    steps:
      - name: Checkout main for release verification
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify staging and required CI runs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: python3 scripts/release.py verify-run

      - name: Download evidence from the selected staging run
        uses: actions/download-artifact@v4
        with:
          name: staging-release-${{ inputs.staging_run_id }}
          run-id: ${{ inputs.staging_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify evidence and current registry digests
        id: verify
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          STAGING_RUN_ID: ${{ inputs.staging_run_id }}
        run: python3 scripts/release.py verify-record

  promote-production:
    needs: verify-release
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure production AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: github-production-${{ github.run_id }}

      - name: Deploy approved staging image digests
        env:
          DEPLOY_INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          IMAGE_TAG: ${{ inputs.release_sha }}
          BACKEND_IMAGE: ${{ needs.verify-release.outputs.backend_image }}
          FRONTEND_IMAGE: ${{ needs.verify-release.outputs.frontend_image }}
        run: python3 scripts/deploy.py --environment production

      - name: Run production smoke tests
        env:
          SMOKE_BACKEND_URL: ${{ secrets.SMOKE_BACKEND_URL }}
          SMOKE_FRONTEND_URL: ${{ secrets.SMOKE_FRONTEND_URL }}
        run: |
          : "${SMOKE_BACKEND_URL:?SMOKE_BACKEND_URL secret is not set}"
          : "${SMOKE_FRONTEND_URL:?SMOKE_FRONTEND_URL secret is not set}"
          python3 scripts/smoke_test.py
