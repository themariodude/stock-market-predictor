name: Staging Deploy

on:
  push:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  secrets-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check app tests

      - name: Check formatting
        run: ruff format --check app tests

      - name: Run tests
        run: pytest

  build-and-push:
    needs:
      - secrets-scan
      - backend-checks

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -f infra/docker/Dockerfile.backend \
            -t ghcr.io/${{ github.repository_owner }}/stock-market-predictor-backend:${{ github.sha }} \
            .

      - name: Build frontend image
        run: |
          docker build \
            -f infra/docker/Dockerfile.frontend \
            -t ghcr.io/${{ github.repository_owner }}/stock-market-predictor-frontend:${{ github.sha }} \
            .

      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/stock-market-predictor-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/stock-market-predictor-frontend:${{ github.sha }}
