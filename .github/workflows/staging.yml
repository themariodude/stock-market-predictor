name: Deployment

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment (production requires the main branch)
        type: choice
        options:
          - staging
          - production
        default: staging
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  validate-target:
    runs-on: ubuntu-latest
    steps:
      - name: Restrict production to main and staging to develop
        env:
          TARGET_ENV: ${{ inputs.environment || 'staging' }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          if [[ "$TARGET_ENV" == production && "$SOURCE_REF" == refs/heads/main ]] || \
             [[ "$TARGET_ENV" == staging && "$SOURCE_REF" == refs/heads/develop ]]; then
            exit 0
          fi
          echo 'Deployment environment does not match the source branch.'
          exit 1

  secrets-scan:
    needs: validate-target
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan complete Git history with redaction
        run: gitleaks detect --redact --log-opts=--all --no-banner

  backend-checks:
    needs: validate-target
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check app tests

      - name: Check formatting
        run: ruff format --check app tests

      - name: Run tests
        run: pytest

      - name: Check deployment scripts
        run: |
          ruff check ../scripts/deploy.py ../scripts/tests
          ruff format --check ../scripts/deploy.py ../scripts/tests
          python -m pytest ../scripts/tests

  build-and-push:
    needs:
      - secrets-scan
      - backend-checks

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -f infra/docker/Dockerfile.backend \
            -t ghcr.io/${{ github.repository_owner }}/stock-market-predictor-backend:${{ github.sha }} \
            .

      - name: Build frontend image
        run: |
          docker build \
            -f infra/docker/Dockerfile.frontend \
            -t ghcr.io/${{ github.repository_owner }}/stock-market-predictor-frontend:${{ github.sha }} \
            .

      - name: Push backend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/stock-market-predictor-backend:${{ github.sha }}

      - name: Push frontend image
        run: |
          docker push \
            ghcr.io/${{ github.repository_owner }}/stock-market-predictor-frontend:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout deployment script
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          mask-aws-account-id: true
          role-session-name: github-deploy-${{ github.run_id }}

      - name: Deploy through SSM without streaming remote logs
        env:
          DEPLOY_INSTANCE_ID: ${{ secrets.DEPLOY_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
          TARGET_ENV: ${{ inputs.environment || 'staging' }}
        run: python3 scripts/deploy.py --environment "$TARGET_ENV"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'staging' }}

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run post-deployment smoke tests
        env:
          SMOKE_BACKEND_URL: ${{ secrets.SMOKE_BACKEND_URL }}
          SMOKE_FRONTEND_URL: ${{ secrets.SMOKE_FRONTEND_URL }}
        run: |
          : "${SMOKE_BACKEND_URL:?SMOKE_BACKEND_URL secret is not set}"
          : "${SMOKE_FRONTEND_URL:?SMOKE_FRONTEND_URL secret is not set}"
          python3 scripts/smoke_test.py
