name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan complete Git history with redaction
        run: gitleaks detect --redact --log-opts=--all --no-banner

  backend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check app tests

      - name: Check formatting
        run: ruff format --check app tests

      - name: Run tests
        run: python -m pytest

      - name: Check deployment scripts
        run: |
          ruff check ../scripts/deploy.py ../scripts/check_ci_results.py ../scripts/tests
          ruff format --check ../scripts/deploy.py ../scripts/check_ci_results.py ../scripts/tests
          python -m pytest ../scripts/tests

  frontend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
  
  required-checks:
    name: CI Required Checks
    if: ${{ always() }}
    needs:
      - secrets-scan
      - backend-checks
      - frontend-checks
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout CI gate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require every CI job to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py
      
  
  docker-build:
    name: Validate Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.backend
          push: false
          tags: stock-market-predictor-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.frontend
          push: false
          tags: stock-market-predictor-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
