name: CI

on:
  pull_request:
    branches:
      - develop
      - main

  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  secrets-scan:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "false"

      - name: Scan complete Git history with redaction
        run: gitleaks detect --redact --log-opts=--all --no-banner

      - name: SOC2 controlled synthetic secret - negative CI test
        shell: bash
        run: |
          set -euo pipefail
          echo "SOC2_TEST_START=$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          test_dir="$RUNNER_TEMP/soc2-gitleaks-test"
          mkdir -p "$test_dir/repo"

          printf '%s\n' \
            'title = "SOC2 Synthetic Secret Test"' \
            '[[rules]]' \
            'id = "soc2-controlled-secret"' \
            "regex = '''SOC2_DUMMY_SECRET_[A-Z0-9]{12}'''" \
            > "$test_dir/config.toml"

          git -C "$test_dir/repo" init -q
          git -C "$test_dir/repo" config user.name "SOC2 Test"
          git -C "$test_dir/repo" config user.email "soc2-test@example.invalid"

          printf 'SOC2_DUMMY_SECRET_%s\n' 'AB12CD34EF56' \
            > "$test_dir/repo/synthetic.txt"

          git -C "$test_dir/repo" add synthetic.txt
          git -C "$test_dir/repo" commit -qm "SOC2 synthetic test"

          curl -fsSL --retry 3 \
            'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' \
            -o "$test_dir/gitleaks.tar.gz"

          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $test_dir/gitleaks.tar.gz" | sha256sum -c -

          tar -xzf "$test_dir/gitleaks.tar.gz" -C "$test_dir" gitleaks

          set +e
          "$test_dir/gitleaks" detect \
            --source "$test_dir/repo" \
            --config "$test_dir/config.toml" \
            --redact --verbose --log-opts=--all --no-banner \
            2>&1 | tee "$test_dir/result.log"

          result=${PIPESTATUS[0]}
          set -e

          echo "SOC2_GITLEAKS_EXIT_CODE=$result"

          if [ "$result" -eq 1 ] && grep -q 'soc2-controlled-secret' "$test_dir/result.log"; then
            echo "SOC2_EXPECTED_DETECTION_CONFIRMED"
            exit "$result"
          fi

          echo "SOC2_TEST_UNEXPECTED_RESULT" >&2
          exit 2

  backend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint Python
        run: ruff check app tests

      - name: Check formatting
        run: ruff format --check app tests

      - name: Run API contract tests
        run: python -m pytest tests/test_api_contract.py

      - name: Run tests
        run: python -m pytest

      - name: Check deployment scripts
        run: |
          ruff check ../scripts/deploy.py ../scripts/check_ci_results.py ../scripts/tests
          ruff format --check ../scripts/deploy.py ../scripts/check_ci_results.py ../scripts/tests
          python -m pytest ../scripts/tests

  frontend-checks:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build
  
  required-checks:
    name: CI Required Checks
    if: ${{ always() }}
    needs:
      - secrets-scan
      - backend-checks
      - frontend-checks
      - docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout CI gate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require every CI job to succeed
        env:
          CI_JOB_RESULTS: ${{ toJSON(needs) }}
        run: python3 scripts/check_ci_results.py
      
  
  docker-build:
    name: Validate Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.backend
          push: false
          tags: stock-market-predictor-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Validate production Nginx frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.frontend-production
          push: false
          tags: stock-market-predictor-frontend-production:ci
          cache-from: type=gha,scope=frontend-production
          cache-to: type=gha,mode=max,scope=frontend-production

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.frontend
          push: false
          tags: stock-market-predictor-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
