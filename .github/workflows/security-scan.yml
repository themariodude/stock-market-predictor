
name: SOC 2 Security Scanning

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-dependencies:
    name: Backend Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: python -m pip install pip-audit==2.10.1

      - name: Audit backend dependencies
        run: |
          python -m pip_audit \
            -r backend/requirements.txt \
            -f json \
            -o backend-audit.json

      - name: Upload backend audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-audit
          path: backend-audit.json
          if-no-files-found: warn

  frontend-dependencies:
    name: Frontend Dependency Audit
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

  backend-container:
    name: Backend Container Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t soc2-backend -f backend/Dockerfile backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: soc2-backend
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  frontend-container:
    name: Frontend Container Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t soc2-frontend -f frontend/Dockerfile frontend

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: soc2-frontend
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
