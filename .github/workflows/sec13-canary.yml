name: SEC-13 Canary Image

on:
  push:
    branches:
      - feature/sec-13-staging-network-hardening

permissions:
  contents: read

jobs:
  build-canary:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate frontend before publishing
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push SEC-13 canary image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./infra/docker/Dockerfile.frontend-production
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/stock-market-predictor-frontend:sec13-${{ github.sha }}

  verify-ssm-smoke:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test tools
        run: python3 -m pip install pytest ruff

      - name: Lint deployment and smoke-test scripts
        run: |
          ruff check scripts/deploy.py scripts/release.py scripts/smoke_ssm.py scripts/tests
          ruff format --check scripts/deploy.py scripts/release.py scripts/smoke_ssm.py scripts/tests

      - name: Run deployment security tests
        run: python3 -m pytest -q scripts/tests
